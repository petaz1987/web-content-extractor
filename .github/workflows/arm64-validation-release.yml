name: Web Content Extractor ARM64 validation and release

on:
  push:
    branches: [main, "codex/**", "feat/**", "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested image from main to GHCR
        required: true
        default: false
        type: boolean
      network_smoke:
        description: Run optional public DNS/HTTPS smoke test (non-gating)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  native-validation:
    name: Native Python / Render path
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.16"

      - name: Run native test suite and static checks
        shell: bash
        run: |
          set -o pipefail
          python -m pip install -r requirements-dev.txt
          python -m pytest -q | tee /tmp/native-pytest-result.txt
          cat /tmp/native-pytest-result.txt >> "$GITHUB_STEP_SUMMARY"
          echo "Native Render-compatible test suite: passed." >> "$GITHUB_STEP_SUMMARY"
          python -m py_compile main.py runtime_config.py product_extraction.py search_extraction.py product_markdown.py guanxe_adapter.py
          git diff --check
        env:
          EXTRACT_API_TOKEN: ci-only-token

  validate-and-build:
    name: ARM64 container validation
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    outputs:
      image_id: ${{ steps.image.outputs.image_id }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        with:
          version: v0.19.3
          driver-opts: image=moby/buildkit:v0.19.0

      - name: Build tested ARM64 runtime image
        id: image
        env:
          IMAGE: local/web-content-extractor:${{ github.sha }}
        run: |
          docker buildx build --platform linux/arm64 --load --tag "$IMAGE" .
          architecture="$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$IMAGE")"
          test "$architecture" = linux/arm64
          image_id="$(docker image inspect --format '{{.Id}}' "$IMAGE")"
          docker save "$IMAGE" -o tested-arm64-image.tar
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "IMAGE_ID=$image_id" >> "$GITHUB_ENV"
          echo "image_id=$image_id" >> "$GITHUB_OUTPUT"
          {
            echo "### ARM64 build evidence"
            echo "- Source: \`$GITHUB_SHA\`"
            echo "- Architecture: \`$architecture\`"
            echo "- Image ID: \`$image_id\`"
            echo "- Dockerfile test stage: passed"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Start container and check health, auth, configuration and all modes
        env:
          IMAGE: local/web-content-extractor:${{ github.sha }}
        run: |
          docker run -d --name wce-validation -p 127.0.0.1:5080:5000 \
            -e EXTRACT_API_TOKEN=ci-container-token -e PORT=5000 \
            -e EXTRACT_CONNECT_TIMEOUT=1 -e EXTRACT_READ_TIMEOUT=2 -e EXTRACT_LOG_LEVEL=DEBUG "$IMAGE"
          for attempt in $(seq 1 30); do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:5080/health || true)"
            if [ "$status" = 200 ]; then break; fi
            sleep 1
          done
          test "$status" = 200
          docker exec wce-validation python -c "import logging,main; assert main.app.config['UPSTREAM_TIMEOUT']==(1.0,2.0); assert main.LOG.getEffectiveLevel()==logging.DEBUG; assert main.app.config['PORT']==5000; print('runtime config overrides verified')"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:5080/extract?url=https://example.com)" = 401
          for mode in full agent search product; do
            if [ "$mode" = full ]; then
              response="$(curl --silent --get http://127.0.0.1:5080/extract --data-urlencode 'url=http://127.0.0.1/private?probe=query-secret' -H 'Authorization: Bearer ci-container-token' -w '\n%{http_code}')"
            else
              response="$(curl --silent --get http://127.0.0.1:5080/extract --data-urlencode 'url=http://127.0.0.1/private?probe=query-secret' --data-urlencode "mode=$mode" -H 'Authorization: Bearer ci-container-token' -w '\n%{http_code}')"
            fi
            test "${response##*$'\n'}" = 403
            echo "$response" | grep -q 'unsafe_url'
          done
          if docker run --rm --entrypoint python -e EXTRACT_API_TOKEN=ci-only-token -e EXTRACT_CONNECT_TIMEOUT=0 "$IMAGE" -c 'import main' >/tmp/invalid-config.log 2>&1; then
            echo "Invalid configuration unexpectedly started" >&2
            exit 1
          fi
          grep -q 'EXTRACT_CONNECT_TIMEOUT' /tmp/invalid-config.log
          docker logs wce-validation > /tmp/wce-container.log 2>&1
          ! grep -q 'ci-container-token\|query-secret\|probe=' /tmp/wce-container.log
          echo "Container checks passed: health, 401, four modes, SSRF rejection, timeout overrides, DEBUG logging, invalid config, and no secret/query leakage."
          echo "Container checks: health, authentication, four modes, SSRF rejection, timeout override, DEBUG, invalid config and log-safety passed." >> "$GITHUB_STEP_SUMMARY"

      - name: Optional public DNS and HTTPS smoke (non-gating)
        if: github.event_name == 'workflow_dispatch' && inputs.network_smoke
        continue-on-error: true
        run: |
          if docker exec wce-validation python -c "from main import _fetch_page; u,_,s,h=_fetch_page('https://example.com/'); print('public_https_status=%d html_bytes=%d' % (s, len(h.encode('utf-8'))))"; then
            echo "Optional public DNS/HTTPS smoke succeeded." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Optional public DNS/HTTPS smoke did not succeed; this does not fail deterministic validation." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Record that public network smoke was not requested
        if: github.event_name != 'workflow_dispatch' || !inputs.network_smoke
        run: |
          echo "Optional public DNS/HTTPS smoke: not requested; deterministic tests remain the release gate." >> "$GITHUB_STEP_SUMMARY"

      - name: Stop validation container
        if: always()
        run: |
          if docker inspect wce-validation >/dev/null 2>&1; then
            docker stop --time 35 wce-validation >/dev/null
            test "$(docker inspect --format '{{.State.ExitCode}}' wce-validation)" = 0
            docker rm wce-validation >/dev/null
          fi

      - name: Save the exact tested image for explicit release
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tested-arm64-${{ github.sha }}
          path: tested-arm64-image.tar
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish exact tested image to GHCR
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: [native-validation, validate-and-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: ghcr-publish
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download tested image artifact
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: tested-arm64-${{ github.sha }}

      - name: Load, verify and publish immutable source tag
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
          SOURCE_IMAGE: local/web-content-extractor:${{ github.sha }}
          TARGET_IMAGE: ghcr.io/petaz1987/web-content-extractor:sha-${{ github.sha }}
          TESTED_IMAGE_ID: ${{ needs.validate-and-build.outputs.image_id }}
        run: |
          docker load -i tested-arm64-image.tar
          architecture="$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$SOURCE_IMAGE")"
          image_id="$(docker image inspect --format '{{.Id}}' "$SOURCE_IMAGE")"
          test "$architecture" = linux/arm64
          test "$image_id" = "$TESTED_IMAGE_ID"
          docker tag "$SOURCE_IMAGE" "$TARGET_IMAGE"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin
          push_output="$(docker push "$TARGET_IMAGE" 2>&1)"
          printf '%s\n' "$push_output"
          digest="$(printf '%s\n' "$push_output" | awk '/digest: sha256:/ {print $3}' | tail -n 1)"
          if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then echo "GHCR did not return a manifest digest" >&2; exit 1; fi
          {
            echo "### Published image evidence"
            echo "- Source commit: \`$GITHUB_SHA\`"
            echo "- Architecture: \`$architecture\`"
            echo "- Tested Docker image ID: \`$image_id\`"
            echo "- Published tag: \`$TARGET_IMAGE\`"
            echo "- Immutable digest: \`ghcr.io/petaz1987/web-content-extractor@$digest\`"
            echo "- Validation job and Docker test gate: passed"
          } >> "$GITHUB_STEP_SUMMARY"
          docker logout ghcr.io
